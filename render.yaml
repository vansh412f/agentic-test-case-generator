services:
  - type: web
    name: agentic-test-generator-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUNNER_TIMEOUT_SCALE
        value: "3"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: PIPELINE_CONCURRENCY
        value: "1"
      - key: CRAWL_CONCURRENCY
        value: "1"
      # Required Secrets (sync: false so values are set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: VISITOR_SIGNING_SECRET
        sync: false
      - key: POW_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional LLM Model Chain Overrides (defaults configured in code)
      - key: GROQ_REASONING_MODELS
        sync: false
      - key: GROQ_FAST_MODELS
        sync: false
      - key: GEMINI_REASONING_MODELS
        sync: false
      - key: GEMINI_FAST_MODELS
        sync: false
